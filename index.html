<style>
:root{
  --ink:#14202B; --slate:#3D4F5E; --mist:#7A8B99; --line:#DDE4E9;
  --bg:#EEF2F4; --card:#FFFFFF;
  --teal:#0E7C7B; --teal-soft:#E0F0EF;
  --signal:#E4572E; --signal-soft:#FCEAE3;
  --gold:#C8891A; --gold-soft:#FBF1DE;
  --green:#2C7A46; --green-soft:#E2F1E7;
  --radius:10px;
  --font-display:'Space Grotesk',sans-serif;
  --font-body:'IBM Plex Sans',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-body);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55}
a{color:var(--teal)}
button{font-family:var(--font-body);cursor:pointer}

/* ---------- header ---------- */
header{background:var(--ink);color:#fff;padding:20px 28px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
header h1{font-family:var(--font-display);font-size:20px;font-weight:700;letter-spacing:.2px}
header h1 span{color:#F2A33C}
.h-meta{font-family:var(--font-mono);font-size:12px;color:#9FB0BE}
.h-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:8px;padding:9px 14px;font-size:13px;font-weight:600}
.btn-primary{background:var(--teal);color:#fff}
.btn-primary:hover{background:#0B6362}
.btn-ghost{background:transparent;color:#CBD6DE;border:1px solid #3D4F5E}
.btn-ghost:hover{color:#fff;border-color:#7A8B99}
.btn-warn{background:var(--signal);color:#fff}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:6px}

/* ---------- tabs ---------- */
nav{background:#fff;border-bottom:1px solid var(--line);padding:0 20px;display:flex;gap:2px;overflow-x:auto;position:sticky;top:0;z-index:40}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:13px 14px;font-size:13.5px;font-weight:600;color:var(--mist);white-space:nowrap}
nav button.active{color:var(--ink);border-bottom-color:var(--signal)}
nav button .cnt{font-family:var(--font-mono);font-size:11px;background:var(--bg);border-radius:10px;padding:1px 7px;margin-left:5px;color:var(--slate)}

main{max-width:1180px;margin:0 auto;padding:24px 20px 80px}

/* ---------- dashboard ---------- */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
.stat .n{font-family:var(--font-display);font-size:30px;font-weight:700}
.stat .l{font-size:12px;color:var(--mist);text-transform:uppercase;letter-spacing:.6px;margin-top:2px}
.stat.applied .n{color:var(--teal)} .stat.interview .n{color:var(--gold)} .stat.offer .n{color:var(--green)} .stat.rejected .n{color:var(--signal)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:20px}
.panel h3{font-family:var(--font-display);font-size:15px;margin-bottom:14px;letter-spacing:.2px}
.funnel-row{display:flex;align-items:center;gap:12px;margin-bottom:9px}
.funnel-row .fl{width:96px;font-size:12.5px;font-weight:600;color:var(--slate)}
.funnel-bar{flex:1;background:var(--bg);border-radius:5px;height:22px;overflow:hidden}
.funnel-bar i{display:block;height:100%;background:var(--teal);border-radius:5px;min-width:2px;transition:width .4s}
.funnel-row .fn{width:34px;text-align:right;font-family:var(--font-mono);font-size:12.5px}
.act-log{font-size:13px}
.act-log li{list-style:none;padding:8px 0;border-bottom:1px dashed var(--line);display:flex;gap:10px}
.act-log .d{font-family:var(--font-mono);font-size:11.5px;color:var(--mist);min-width:78px}

/* ---------- job cards ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.toolbar input[type=text]{flex:1;min-width:200px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;background:#fff}
.toolbar select{padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:#fff}
.note{font-size:12.5px;color:var(--mist);margin-bottom:14px}
.job{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:14px;overflow:hidden}
.job-head{display:flex;flex-wrap:wrap;gap:12px;padding:16px 18px;align-items:flex-start}
.job-title{flex:1;min-width:240px}
.job-title h4{font-family:var(--font-display);font-size:16px;font-weight:600}
.job-title h4 a{color:var(--ink);text-decoration:none}
.job-title h4 a:hover{color:var(--teal)}
.job-title .org{font-size:13px;color:var(--slate);margin-top:2px}
.job-title .meta{font-family:var(--font-mono);font-size:11.5px;color:var(--mist);margin-top:5px;display:flex;gap:12px;flex-wrap:wrap}
.tag{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;border-radius:4px;padding:2px 7px;margin-right:6px}
.tag.cat{background:var(--teal-soft);color:var(--teal)}
.tag.res{background:var(--gold-soft);color:var(--gold)}
.tag.verify{background:var(--signal-soft);color:var(--signal)}
.ats{width:86px;text-align:center}
.ats .ring{font-family:var(--font-display);font-size:23px;font-weight:700;border:3px solid var(--teal);border-radius:50%;width:58px;height:58px;display:flex;align-items:center;justify-content:center;margin:0 auto}
.ats .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--mist);margin-top:4px}
.ats.mid .ring{border-color:var(--gold)} .ats.low .ring{border-color:var(--signal)}
.job-status{min-width:150px}
.job-status select{width:100%;padding:7px 8px;border:1.5px solid var(--line);border-radius:7px;font-size:12.5px;font-weight:600;background:#fff}
.rail{display:flex;gap:3px;margin-top:8px}
.rail i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.rail i.on{background:var(--teal)} .rail i.bad{background:var(--signal)} .rail i.win{background:var(--green)}
.job-body{border-top:1px solid var(--line);padding:14px 18px;display:none;background:#FBFCFD}
.job.open .job-body{display:block}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:760px){.cols{grid-template-columns:1fr}}
.blk h5{font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--mist);margin-bottom:6px}
.blk ul{padding-left:18px;font-size:13px;margin-bottom:12px}
.blk li{margin-bottom:3px}
.blk.fav li::marker{color:var(--green)} .blk.gap li::marker{color:var(--signal)}
.kw{font-family:var(--font-mono);font-size:12px;background:var(--gold-soft);border-radius:4px;padding:1px 6px}
.doc-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.doc-btns .btn{background:var(--ink);color:#fff}
.doc-btns .btn.alt{background:#fff;color:var(--ink);border:1px solid var(--line)}
.toggle{background:none;border:0;color:var(--teal);font-size:12.5px;font-weight:600;padding:10px 18px;width:100%;text-align:left;border-top:1px solid var(--line)}
.empty{padding:40px;text-align:center;color:var(--mist);background:var(--card);border:1px dashed var(--line);border-radius:var(--radius)}

/* ---------- modal ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(16,24,32,.55);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:30px 14px;overflow-y:auto}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:12px;max-width:820px;width:100%;padding:24px}
.modal h3{font-family:var(--font-display);font-size:17px;margin-bottom:4px}
.modal .sub{font-size:12.5px;color:var(--mist);margin-bottom:14px}
.modal pre{white-space:pre-wrap;font-family:var(--font-body);font-size:13.5px;background:var(--bg);border-radius:8px;padding:18px;max-height:55vh;overflow-y:auto;line-height:1.6}
.modal .m-actions{display:flex;gap:8px;margin-top:14px;justify-content:flex-end;flex-wrap:wrap}
.modal textarea,.modal input[type=text],.modal input[type=date],.modal select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;margin-bottom:10px;font-family:var(--font-body)}
.modal label{font-size:12px;font-weight:600;color:var(--slate);display:block;margin-bottom:3px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;z-index:200;display:none}
.toast.show{display:block}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

  const opener = isPM
    ? `Over the past nine years I have owned product strategy and Agile delivery for TELUS Optik TV — a 3.4M-subscriber platform, four squads, roughly a dozen releases a year — moving from Product Owner into Technical Product Manager. The ${j.title} role at ${j.org} is a direct extension of that work.`
    : `For the past nine years at TELUS I have served as the liaison between technology and business teams for the Optik TV platform — eliciting requirements, modelling current- and future-state processes, and steering releases through PMO-governed GO/NoGO gates. The ${j.title} role at ${j.org} maps closely to that day-to-day work.`;
  const proof = isPM
    ? `Highlights that translate directly: I led a five-partner OTT integration (Netflix, Prime Video, Apple TV+, Disney+, TSN) that added $1.1M in revenue and cut nearly $500K in churn-driven call-centre cost; I cleared CRTC regulatory requirements blocking launch; I built the business case for and launched cPVR into Eastern Canada; and I have kept on-time delivery above 95% while cutting time-to-release by a third and requirements rework by 40%. I back decisions with Splunk, Adobe Analytics, and SQL rather than opinion.`
    : `Highlights that translate directly: I reduced regression testing cycle time 70% through process redesign; wrote the specs, process maps, HLD/LLD documents, and SOPs that serve as the single source of truth for engineering and QA; led our Waterfall-to-SAFe transformation; and delivered municipal and enterprise deployments — including the full IT infrastructure for the Regional Municipality of Wood Buffalo and a 3,000+ user Shell Canada rollout with zero business-critical disruptions.`;
  const closer = j.clPara ? j.clPara+"\n\n" : "";
  return `Dear Hiring Manager,

I am writing to apply for the ${j.title} position at ${j.org}.

${opener}

${proof}

${closer}I hold SAFe 5 Practitioner and ITIL v3 certifications, an M.Sc. in Internetworking from the University of Alberta, and I am based in Edmonton, available immediately${j.cat==="us"?" and set up to work remotely from Canada across North American time zones":""}.

I would welcome the chance to discuss how my experience can contribute to your team.

Sincerely,
Nehal Sharma
780-901-8325 · nehalsharma1@gmail.com · Edmonton, AB`;
}
function outreachMsg(j){
  const hook = j.resume==="PM"
    ? "9 yrs of product management on TELUS Optik TV (3.4M users) — OTT partner integrations, +$1.1M revenue features, 95%+ on-time delivery"
    : "12 yrs in IT business analysis — TELUS PMO-governed delivery, 70% regression-cycle reduction, municipal + enterprise deployments";
  return `Hi [Name],

I just applied for the ${j.title} role at ${j.org} and wanted to reach out directly. Quick background: ${hook}. SAFe 5 certified, M.Sc. from U of A, based in Edmonton.

I'd genuinely appreciate 15 minutes to learn what success in this role looks like from your side. Either way, thanks for considering my application.

— Nehal Sharma`;
}
function resumeTweaks(j){
  return (j.swaps||[]).map(s=>`Replace "${s[0]}" → "${s[1]}"`).concat(j.tweaks||[]);
}

/* =====================================================================
   STORAGE — window.storage (Claude artifact) → localStorage (GitHub
   Pages) → memory. Single key.
   ===================================================================== */
const SKEY = "jobtracker-state-v1";
let MEM = null;
async function saveState(s){
  const str = JSON.stringify(s); MEM = s;
  try{ if(window.storage){ await window.storage.set(SKEY,str); return; } }catch(e){}
  try{ const ls = window["local"+"Storage"]; if(ls){ ls.setItem(SKEY,str); return; } }catch(e){}
}
async function loadState(){
  try{ if(window.storage){ const r = await window.storage.get(SKEY); if(r&&r.value) return JSON.parse(r.value); } }catch(e){}
  try{ const ls = window["local"+"Storage"]; if(ls){ const v = ls.getItem(SKEY); if(v) return JSON.parse(v); } }catch(e){}
  return MEM;
}

/* ---------- state ---------- */
let state = { jobs: [], log: [] };
let activeTab = "dash";
let filterQ = "", filterStatus = "";

function statusOf(j){ return j.status || "Saved"; }
function logEvent(txt){ state.log.unshift({d:new Date().toISOString().slice(0,10), t:txt}); state.log = state.log.slice(0,60); }

async function init(){
  document.getElementById("todayStamp").textContent = TODAY.toDateString();
  const saved = await loadState();
  if(saved && saved.jobs && saved.jobs.length){ state = saved; }
  else { state.jobs = SEED.map(j=>({...j, status:"Saved", notes:"", dates:{}})); logEvent("Tracker initialized with "+state.jobs.length+" researched roles"); await saveState(state); }
  // merge any new seed jobs added in later versions
  SEED.forEach(s=>{ if(!state.jobs.find(j=>j.id===s.id)) state.jobs.push({...s,status:"Saved",notes:"",dates:{}}); });
  renderTabs(); render();
}

/* =====================================================================
   RENDERING
   ===================================================================== */
function visibleJobs(cat){
  return state.jobs
    .filter(j=>ageDays(j.posted)<=MAX_AGE_DAYS || ["Applied","Screening","Interview","Offer","Accepted"].includes(statusOf(j)))
    .filter(j=>!cat||j.cat===cat)
    .filter(j=>!filterQ || (j.title+" "+j.org).toLowerCase().includes(filterQ.toLowerCase()))
    .filter(j=>!filterStatus || statusOf(j)===filterStatus)
    .sort((a,b)=>new Date(b.posted)-new Date(a.posted));
}
function renderTabs(){
  const nav = document.getElementById("tabs"); nav.innerHTML = "";
  Object.entries(CATS).forEach(([k,v])=>{
    const b = document.createElement("button");
    const n = (k==="dash"||k==="outreach") ? "" : `<span class="cnt">${visibleJobs(k).length}</span>`;
    b.innerHTML = esc(v.label)+n;
    b.className = k===activeTab?"active":"";
    b.onclick = ()=>{activeTab=k;renderTabs();render();};
    nav.appendChild(b);
  });
}
function render(){
  const m = document.getElementById("main");
  if(activeTab==="dash") return renderDash(m);
  if(activeTab==="outreach") return renderOutreach(m);
  renderJobs(m, activeTab);
}

/* ---------- dashboard ---------- */
function renderDash(m){
  const js = state.jobs;
  const c = s => js.filter(j=>statusOf(j)===s).length;
  const applied = js.filter(j=>["Applied","Screening","Interview","Offer","Accepted","Rejected"].includes(statusOf(j))).length;
  const responses = js.filter(j=>["Screening","Interview","Offer","Accepted"].includes(statusOf(j))).length;
  const rr = applied? Math.round(100*responses/applied) : 0;
  const funnel = ["Applied","Screening","Interview","Offer","Accepted"].map(s=>{
    const n = s==="Applied"? applied : js.filter(j=>{
      const order = ["Screening","Interview","Offer","Accepted"];
      const idx = order.indexOf(s);
      return order.indexOf(statusOf(j))>=idx;
    }).length;
    return [s,n];
  });
  const max = Math.max(1,...funnel.map(f=>f[1]));
  m.innerHTML = `
  <div class="stat-grid">
    <div class="stat"><div class="n">${js.length}</div><div class="l">Roles tracked</div></div>
    <div class="stat applied"><div class="n">${applied}</div><div class="l">Applied</div></div>
    <div class="stat"><div class="n">${c("Screening")}</div><div class="l">In screening</div></div>
    <div class="stat interview"><div class="n">${c("Interview")}</div><div class="l">Interviewing</div></div>
    <div class="stat offer"><div class="n">${c("Offer")+c("Accepted")}</div><div class="l">Offers</div></div>
    <div class="stat rejected"><div class="n">${c("Rejected")}</div><div class="l">Rejected</div></div>
    <div class="stat"><div class="n">${rr}%</div><div class="l">Response rate</div></div>
  </div>
  <div class="panel"><h3>Pipeline funnel</h3>
    ${funnel.map(([s,n])=>`<div class="funnel-row"><div class="fl">${s}</div><div class="funnel-bar"><i style="width:${Math.round(100*n/max)}%"></i></div><div class="fn">${n}</div></div>`).join("")}
  </div>
  <div class="panel"><h3>By category (fresh & active)</h3>
    ${["muni","prov","fed","tech","nontech","us"].map(k=>`<div class="funnel-row"><div class="fl" style="width:170px">${esc(CATS[k].label)}</div><div class="funnel-bar"><i style="width:${Math.min(100,visibleJobs(k).length*12)}%"></i></div><div class="fn">${visibleJobs(k).length}</div></div>`).join("")}
  </div>
  <div class="panel"><h3>Activity log</h3><ul class="act-log">
    ${state.log.length? state.log.map(e=>`<li><span class="d">${esc(e.d)}</span><span>${esc(e.t)}</span></li>`).join("") : "<li>No activity yet.</li>"}
  </ul></div>`;
}

    if(st==="Rejected") return `<i class="${i===0?"bad":""}"></i>`;

    return `<i class="${i<=stIdx?"on":""}"></i>`;

  return `
  <div class="job ${j._open?"open":""}" id="card_${j.id}">
    <div class="job-head">
      <div class="job-title">
        <div style="margin-bottom:5px"><span class="tag cat">${esc(CATS[j.cat].label)}</span><span class="tag res">${j.resume} resume</span>${j.verify?'<span class="tag verify">verify date</span>':""}</div>

      </div>

      <div class="job-status">

        </select>
        <div class="rail">${rail}</div>
      </div>
    </div>
    <button class="toggle" onclick="toggleJob('${j.id}')">${j._open?"▴ Hide":"▾ Show"} fit analysis, resume tuning, cover letter & outreach</button>
    <div class="job-body">
      <div class="cols">
        <div class="blk fav"><h5>Works in your favour</h5><ul>${(j.fav||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
        <div class="blk gap"><h5>Gaps</h5><ul>${(j.gap||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
          <h5>Keyword swaps → boosts ATS ${j.ats} → ${j.atsBoost}</h5>
          <ul>${(j.swaps||[]).map(s=>`<li><span class="kw">${esc(s[0])}</span> → <span class="kw">${esc(s[1])}</span></li>`).join("")}
          ${(j.tweaks||[]).map(t=>`<li>${esc(t)}</li>`).join("")}</ul>
        </div>
      </div>
      <div class="doc-btns">
        <button class="btn btn-sm" onclick="showDoc('${j.id}','cl')">Cover letter</button>

        <button class="btn btn-sm alt" onclick="showDoc('${j.id}','li')">LinkedIn message</button>
        <button class="btn btn-sm alt" onclick="editNotes('${j.id}')">Notes${j.notes?" ●":""}</button>
      </div>
    </div>
  </div>`;
}
function toggleJob(id){ const j = state.jobs.find(x=>x.id===id); j._open = !j._open; render(); }
async function setStatus(id,s){
  const j = state.jobs.find(x=>x.id===id);

/* =====================================================================
   AI FEATURES — work inside the Claude.ai artifact runtime.
   On GitHub Pages these show a friendly explanation instead of failing.
   ===================================================================== */
async function callClaude(prompt, useSearch){
  const body = { model:"claude-sonnet-4-6", max_tokens:1000, messages:[{role:"user",content:prompt}] };
  if(useSearch) body.tools = [{type:"web_search_20250305", name:"web_search"}];
  const res = await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  if(!res.ok) throw new Error("API "+res.status);
  const data = await res.json();
  return data.content.filter(i=>i.type==="text").map(i=>i.text).join("\n");
}
